<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="MONTE ERICE">
  <rect width="960" height="540" fill="#161616"/>
  <pattern id="sc-top" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="#F2EEE4"/>
    <rect width="30" height="30" fill="#D62B1F"/>
    <rect x="30" y="30" width="30" height="30" fill="#D62B1F"/>
  </pattern>
  <rect x="0" y="0" width="960" height="60" fill="url(#sc-top)"/>
  <pattern id="sc-bot" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="#F2EEE4"/>
    <rect width="30" height="30" fill="#D62B1F"/>
    <rect x="30" y="30" width="30" height="30" fill="#D62B1F"/>
  </pattern>
  <rect x="0" y="480" width="960" height="60" fill="url(#sc-bot)"/>
  <rect x="30" y="90" width="900" height="360" fill="none" stroke="#8C1A12" stroke-width="7.5"/>
  <text x="480" y="270" fill="#F5C518" font-family="Arial Narrow, Arial, sans-serif" font-weight="700" font-size="68" letter-spacing="2" text-anchor="middle" dominant-baseline="middle">MONTE ERICE</text>
  <text x="480" y="347" fill="#F2EEE4" font-family="Arial, sans-serif" font-size="30" letter-spacing="3" text-anchor="middle" dominant-baseline="middle">TRACCIATO</text>
</svg>
