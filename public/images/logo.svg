<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 112" width="360" height="112" role="img" aria-label="Passione Slalom">
  <defs>
    <pattern id="scacchi-logo" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F2EEE4"/>
      <rect width="8" height="8" fill="#D62B1F"/>
      <rect x="8" y="8" width="8" height="8" fill="#D62B1F"/>
    </pattern>
    <clipPath id="ovale">
      <ellipse cx="180" cy="56" rx="176" ry="52"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ovale)">
    <rect width="360" height="112" fill="url(#scacchi-logo)"/>
    <ellipse cx="180" cy="56" rx="162" ry="38" fill="#161616"/>
  </g>
  <ellipse cx="180" cy="56" rx="176" ry="52" fill="none" stroke="#8C1A12" stroke-width="4"/>
  <text x="180" y="50" fill="#F5C518" font-family="Arial Narrow, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="1" text-anchor="middle">PASSIONE</text>
  <text x="180" y="80" fill="#F2EEE4" font-family="Arial Narrow, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="7" text-anchor="middle">SLALOM</text>
</svg>
