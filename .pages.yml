# Configurazione di PagesCMS (https://pagescms.org/docs/configuration/).
#
# Le immagini stanno in src/assets/ e non in public/: è la cartella che Astro
# ottimizza in build (ridimensiona, converte, taglia sotto i 250 kB per variante).
# Per questo `output` ricalca `input` con lo slash iniziale: nel frontmatter
# finisce "/src/assets/...", cioè un percorso dalla radice del progetto, la forma
# che `image()` risolve nelle content collection (vedi src/content.config.ts).
# Una cartella `media` per sezione, così la finestra di scelta si apre già al
# posto giusto e le foto non si mescolano tra galleria, tracciati e staff.

media:
  - name: galleria
    label: Foto della galleria
    input: src/assets/galleria
    output: /src/assets/galleria
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: tracciati
    label: Foto dei tracciati
    input: src/assets/tracciati
    output: /src/assets/tracciati
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: auto
    label: Foto delle auto
    input: src/assets/auto
    output: /src/assets/auto
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: staff
    label: Foto dello staff
    input: src/assets/staff
    output: /src/assets/staff
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: partners
    label: Loghi dei partner
    input: src/assets/partners
    output: /src/assets/partners
    extensions: [svg, png, jpg, jpeg, webp]
    rename: safe

content:
  # ---------- galleria ----------
  # Un file solo con una lista: l'ordine delle righe è l'ordine della pagina
  # /galleria/, e le prime sei righe sono anche le foto della homepage.
  - name: galleria
    label: Galleria
    type: file
    path: src/content/galleria/galleria.md
    format: yaml-frontmatter
    fields:
      - name: foto
        label: Foto
        type: object
        list: true
        fields:
          - name: file
            label: Immagine
            type: image
            required: true
            options:
              media: galleria
          - name: descrizione
            label: Descrizione
            type: text

  # ---------- partners ----------
  - name: partners
    label: Partners
    type: file
    path: src/content/partners/partners.md
    format: yaml-frontmatter
    fields:
      - name: partners
        label: Partners
        type: object
        list: true
        fields:
          - name: nome
            label: Nome
            type: string
            required: true
            description: Fa anche da testo alternativo del logo.
          - name: logo
            label: Logo
            type: image
            required: true
            options:
              media: partners
          - name: sito
            label: URL sito
            type: string
            description: >-
              Facoltativo. Se c'è, il logo in homepage diventa cliccabile e si
              apre in una nuova scheda; se manca, resta un'immagine e basta.

  # ---------- carriera ----------
  # Un file per gioco con dentro la lista dei piloti. In pagina la classifica si
  # ordina da sola per crediti decrescenti e la posizione (1, 2, 3…) la calcola
  # il sito: qui basta aggiornare il numero dei crediti, senza spostare righe né
  # rinumerare nulla. L'ordine delle righe conta solo a parità di crediti.
  - name: carriera-assetto-corsa
    label: Carriera (Assetto Corsa)
    type: file
    path: src/content/carriera/carriera-passione-slalom-assetto-corsa.md
    format: yaml-frontmatter
    fields:
      - name: aggiornato
        label: Aggiornato al
        type: string
        description: >-
          Fino a dove arrivano i conteggi, per esempio il nome dell'ultimo
          campionato. Sopra la tabella compare come "Classifica aggiornata
          al …", quindi qui va solo il seguito della frase. Vuoto: la riga
          non viene mostrata.
      - name: piloti
        label: Piloti
        type: object
        list: true
        fields:
          - name: nome
            label: Pilota
            type: string
            required: true
          - name: auto
            label: Auto
            type: string
            description: Facoltativa. Senza, in tabella compare un trattino.
          - name: crediti
            label: Crediti
            type: number
            required: true
            description: Decide la posizione in classifica, dal più alto al più basso.

  # ---------- tracciati ----------
  # Qui un file per voce: sono tante e crescono, quindi l'elenco tabellare con
  # ricerca e filtri è più comodo di una lista unica. L'ordine è il campo `ordine`.
  - name: tracciati
    label: Tracciati
    type: collection
    path: src/content/tracciati
    format: yaml-frontmatter
    # Lo stesso tracciato può esistere su più giochi: senza il gioco nel nome
    # file, la seconda voce sovrascriverebbe la prima.
    filename: "{fields.titolo}-{fields.gioco}.md"
    view:
      primary: titolo
      fields: [titolo, gioco, ordine]
      sort: [ordine, titolo, gioco]
      search: [titolo]
      default:
        sort: ordine
        order: asc
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: foto
        label: Foto
        type: image
        required: true
        options:
          media: tracciati
      - name: video
        label: Video
        type: string
        required: true
        description: Link al video onboard, su YouTube o Facebook. Si apre in una nuova scheda.
      - name: modder
        label: Modder
        type: string
      - name: gioco
        label: Gioco
        type: select
        required: true
        options:
          values:
            - { value: assetto-corsa, label: Assetto Corsa }
            - { value: rfactor, label: rFactor }
            - { value: trackday-r, label: TrackDay R }
      - name: ordine
        label: Ordine
        type: number
        description: >-
          Numero di posizione dentro il proprio gioco, dal più basso al più alto.
          Le voci senza numero finiscono in fondo, in ordine alfabetico.

  # ---------- auto ----------
  # Quasi gli stessi campi dei tracciati: le due sezioni usano la stessa card sul
  # sito e devono restare identiche a vedersi. In più le auto hanno il costo in
  # crediti e il server dove sono disponibili.
  - name: auto
    label: Auto
    type: collection
    path: src/content/auto
    format: yaml-frontmatter
    filename: "{fields.titolo}-{fields.gioco}.md"
    view:
      primary: titolo
      fields: [titolo, gioco, ordine]
      sort: [ordine, titolo, gioco]
      search: [titolo]
      default:
        sort: ordine
        order: asc
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: foto
        label: Foto
        type: image
        required: true
        options:
          media: auto
      - name: video
        label: Video
        type: string
        required: true
        description: Link al video di riferimento della vettura. Si apre in una nuova scheda.
      - name: crediti
        label: Crediti
        type: number
      - name: server
        label: Server
        type: string
      - name: modder
        label: Modder
        type: string
      - name: gioco
        label: Gioco
        type: select
        required: true
        options:
          values:
            - { value: assetto-corsa, label: Assetto Corsa }
            - { value: rfactor, label: rFactor }
            - { value: trackday-r, label: TrackDay R }
      - name: ordine
        label: Ordine
        type: number
        description: >-
          Numero di posizione dentro il proprio gioco, dal più basso al più alto.
          Le voci senza numero finiscono in fondo, in ordine alfabetico.

  # ---------- staff ----------
  - name: staff
    label: Staff
    type: file
    path: src/content/staff/staff.md
    format: yaml-frontmatter
    fields:
      - name: staff
        label: Staff
        type: object
        list: true
        fields:
          - name: nome
            label: Nome
            type: string
            required: true
            description: Fa anche da testo alternativo della foto.
          - name: ruolo
            label: Ruolo
            type: string
            required: true
            description: Mostrato in maiuscolo sotto il nome, per esempio "Fondatore".
          - name: foto
            label: Foto
            type: image
            required: true
            description: "Viene tagliata quadrata: meglio una foto con il viso al centro."
            options:
              media: staff
